<!DOCTYPE html>
<html>
<head>
  <title>More Forms</title>
</head>
<body>

  <h1>Feedback Form</h1>
  
  <p>Please fill out this form to help us improve our site.</p>

  <form>
    <p>
      <label>Name: <input type="text" name="name" size="30"></label>
    </p>

    <p>
      <label>Comments:<br>
        <textarea name="comments" rows="4" cols="40">Enter comments here.</textarea>
      </label>
    </p>

    <p>
      <label>E-mail Address: <input type="text" name="email" size="30"></label>
    </p>

    <p>
      <strong>Things you liked:</strong><br>
      <label><input type="checkbox" name="likes" value="design"> Site design</label>
      <label><input type="checkbox" name="likes" value="links"> Links</label>
      <label><input type="checkbox" name="likes" value="ease"> Ease of use</label>
      <label><input type="checkbox" name="likes" value="images"> Images</label>
      <label><input type="checkbox" name="likes" value="code"> Source code</label>
    </p>

    <p>
      <strong>How did you get to our site?:</strong><br>
      <label><input type="radio" name="referrer" value="search"> Search engine</label>
      <label><input type="radio" name="referrer" value="links"> Links from another site</label>
      <label><input type="radio" name="referrer" value="deitel" checked> Deitel.com Web site</label>
      <label><input type="radio" name="referrer" value="book"> Reference in a book</label>
      <label><input type="radio" name="referrer" value="other"> Other</label>
    </p>

    <p>
      <label>Rate our site:
        <select name="rating">
          <option selected>Amazing</option>
          <option>10</option>
          <option>9</option>
          <option>8</option>
          <option>7</option>
          <option>6</option>
          <option>5</option>
          <option>4</option>
          <option>3</option>
          <option>2</option>
          <option>1</option>
          <option>Awful</option>
        </select>
      </label>
      <input type="submit" value="Submit">
      <input type="reset" value="Clear">
    </p>
  </form>

</body>
</html>
